{% extends 'productinfo/base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="mx-auto mt-8 max-w-sm">
  <div class="rounded-3xl bg-white p-6 shadow-sm ring-1 ring-stone-100">
    <h2 class="mb-4 text-center text-xl font-bold text-brick-800">ဝင်ရောက်ရန်</h2>

    {% if form.errors %}
    <p class="mb-4 rounded-xl bg-red-100 px-3 py-2 text-sm text-red-800">
      အမည် သို့မဟုတ် စကားဝှက် မှားနေပါသည်။
    </p>
    {% endif %}

    <form method="POST" class="space-y-4">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      <div>
        <label for="id_username" class="mb-1 block text-sm font-medium text-stone-600">အမည်</label>
        <input type="text" name="username" id="id_username" autofocus required autocomplete="username"
               class="w-full rounded-xl border border-stone-300 px-3 py-2.5 focus:border-brick-500 focus:outline-none">
      </div>
      <div>
        <label for="id_password" class="mb-1 block text-sm font-medium text-stone-600">စကားဝှက်</label>
        <input type="password" name="password" id="id_password" required autocomplete="current-password"
               class="w-full rounded-xl border border-stone-300 px-3 py-2.5 focus:border-brick-500 focus:outline-none">
      </div>
      <button type="submit"
              class="w-full rounded-xl bg-brick-600 py-3 text-sm font-semibold text-white shadow active:bg-brick-700">
        ဝင်ရောက်မည်
      </button>
    </form>
  </div>
</div>
{% endblock %}
